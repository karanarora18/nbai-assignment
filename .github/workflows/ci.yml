name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
env:
  RESTFUL_BOOKER_USERNAME: ${{ secrets.RESTFUL_BOOKER_USERNAME }}
  RESTFUL_BOOKER_PASSWORD: ${{ secrets.RESTFUL_BOOKER_PASSWORD }}
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Plain `mvn test` runs the API suite only; mobile tests are excluded by default in pom.xml.
      - name: Run API tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: ignore

      # Allure 2 CLI from npm (Node and Java are on the runner); pinned so report generation is reproducible.
      - name: Generate Allure HTML report
        if: always()
        run: npx --yes allure-commandline@2.29.0 generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/allure-report
          if-no-files-found: ignore
